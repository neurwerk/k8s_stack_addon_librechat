[project]
name = "librechat-tooling"
version = "0.1.7"
description = "LibreChat native permission provisioning resources"
requires-python = ">=3.12"
dependencies = ["k8s-stack-tooling==0.14.0"]

[tool.uv.sources]
k8s-stack-tooling = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/v0.14.0/k8s_stack_tooling-0.14.0-py3-none-any.whl"}
openbao-stack-setup = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/stack-setup-v0.7.0/openbao_stack_setup-0.7.0-py3-none-any.whl"}

[project.scripts]
librechat-stage-permissions = "librechat_tooling.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15.17", "ty>=0.0.49", "openbao-stack-setup==0.7.0"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["librechat_tooling"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
