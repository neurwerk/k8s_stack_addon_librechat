{{- $existing := lookup "apps/v1" "StatefulSet" .Release.Namespace "frontend-librechat-valkey-stateful-set" -}}
{{- $claims := list -}}
{{- if $existing -}}
{{- $claims = $existing.spec.volumeClaimTemplates -}}
{{- if or (ne (len $claims) 1) (ne (first $claims).metadata.name "frontend-librechat-valkey-data") }}{{ fail "existing Valkey StatefulSet has unexpected claim templates" }}{{ end -}}
{{- $spec := (first $claims).spec -}}
{{- $persistence := .Values.frontendLibrechat.valkey.persistence -}}
{{- if ne (toString $spec.resources.requests.storage) (toString $persistence.size) }}{{ fail "Valkey claim template size is immutable; storage changes require a separately approved migration" }}{{ end -}}
{{- if and $persistence.storageClassName (ne $spec.storageClassName $persistence.storageClassName) }}{{ fail "Valkey claim template storage class is immutable; storage changes require a separately approved migration" }}{{ end -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frontend-librechat-valkey-stateful-set
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-valkey.labels" . | nindent 4 }}
  annotations:
    secret.reloader.stakater.com/reload: frontend-librechat-secret
spec:
  serviceName: frontend-librechat-valkey-service
  replicas: {{ .Values.frontendLibrechat.valkey.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "frontend-librechat-valkey.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend-librechat-valkey.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "frontend-librechat-valkey.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.frontendLibrechat.valkey.image | quote }}
          imagePullPolicy: {{ .Values.frontendLibrechat.valkey.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              test -n "$VALKEY_PASSWORD" || { echo "VALKEY_PASSWORD is required" >&2; exit 1; }
              umask 077
              printf 'requirepass %s\nappendonly yes\nsave ""\ndir /data\n' "$VALKEY_PASSWORD" > /run/valkey/valkey.conf
              exec valkey-server /run/valkey/valkey.conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: valkey
              containerPort: {{ .Values.frontendLibrechat.valkey.service.port }}
              protocol: TCP
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-librechat-secret
                  key: VALKEY_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: frontend-librechat-secret
                  key: VALKEY_PASSWORD
          volumeMounts:
            - name: frontend-librechat-valkey-data
              mountPath: /data
            - name: runtime
              mountPath: /run/valkey
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - valkey-cli
                - -e
                - ping
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - -e
                - ping
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - -e
                - ping
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontendLibrechat.valkey.resources | nindent 12 }}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    {{- if $existing }}
    {{- /* Preserve the complete immutable template, including API defaults and original labels. */}}
    {{- toYaml $claims | nindent 4 }}
    {{- else }}
    - metadata:
        name: frontend-librechat-valkey-data
        labels:
          {{- include "frontend-librechat-valkey.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.frontendLibrechat.valkey.persistence.size }}
        {{- with .Values.frontendLibrechat.valkey.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
    {{- end }}
