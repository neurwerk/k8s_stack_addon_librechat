apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-librechat-runtime-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-shared.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-librechat-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-librechat-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        CREDS_IV: "{{ `{{ .credsIv }}` }}"
        CREDS_KEY: "{{ `{{ .credsKey }}` }}"
        DOMAIN_CLIENT: {{ printf "https://%s" .Values.frontendLibrechat.hostname | quote }}
        DOMAIN_SERVER: {{ printf "https://%s" .Values.frontendLibrechat.hostname | quote }}
        JWT_REFRESH_SECRET: "{{ `{{ .jwtRefreshSecret }}` }}"
        JWT_SECRET: "{{ `{{ .jwtSecret }}` }}"
        MEILI_MASTER_KEY: "{{ `{{ .meiliMasterKey }}` }}"
        MONGO_URI: {{ printf "mongodb://{{ .documentdbUser | urlquery }}:{{ .documentdbPassword | urlquery }}@%s:%v/%s?authSource=%s&authMechanism=%s&tls=true&tlsCAFile=%s&directConnection=%v" .Values.frontendLibrechat.documentdb.host .Values.frontendLibrechat.documentdb.port (.Values.frontendLibrechat.documentdb.database | urlquery) (.Values.frontendLibrechat.documentdb.authSource | urlquery) (.Values.frontendLibrechat.documentdb.authMechanism | urlquery) (.Values.frontendLibrechat.documentdb.tls.caFile | urlquery) .Values.frontendLibrechat.documentdb.directConnection | quote }}
        OPENID_CLIENT_SECRET: "{{ `{{ .openidClientSecret }}` }}"
        OPENID_CLIENT_ID: {{ .Values.authKeycloak.librechatClientId | quote }}
        OPENID_ISSUER: {{ printf "https://%s/realms/%s" .Values.authKeycloak.hostname .Values.authKeycloak.realm | quote }}
        OPENID_SESSION_SECRET: "{{ `{{ .openidSessionSecret }}` }}"
        REDIS_URI: {{ printf "redis://:{{ .valkeyPassword | urlquery }}@%s:%v/0" .Values.frontendLibrechat.valkey.service.name .Values.frontendLibrechat.valkey.service.port | quote }}
        VALKEY_PASSWORD: "{{ `{{ .valkeyPassword }}` }}"
  data:
    {{- range $field := list "credsIv" "credsKey" "jwtRefreshSecret" "jwtSecret" "meiliMasterKey" "openidSessionSecret" "valkeyPassword" }}
    - secretKey: {{ $field }}
      remoteRef:
        key: addons/librechat/runtime
        property: {{ $field }}
    {{- end }}
    {{- range $field := list "documentdbUser" "documentdbPassword" }}
    - secretKey: {{ $field }}
      remoteRef:
        key: addons/librechat/database
        property: {{ $field }}
    {{- end }}
    - secretKey: openidClientSecret
      remoteRef:
        key: addons/librechat/oidc
        property: openidClientSecret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-librechat-admin-panel-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-shared.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-librechat-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-librechat-admin-panel-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        ADMIN_PANEL_METRICS_SECRET: "{{ `{{ .adminPanelMetricsSecret }}` }}"
        SESSION_SECRET: "{{ `{{ .adminPanelSessionSecret }}` }}"
  data:
    {{- range $field := list "adminPanelMetricsSecret" "adminPanelSessionSecret" }}
    - secretKey: {{ $field }}
      remoteRef:
        key: addons/librechat/runtime
        property: {{ $field }}
    {{- end }}
