frontendLibrechat:
  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.35.1@sha256:8b57fc3c7f46535ddef3828df1538465ac19d892eb57c9a10da6df0880bd5856
    imagePullPolicy: IfNotPresent
    # Keep unexpected events visible without routine HTTP request logs.
    logLevel: WARN
    replicas: 1
    service:
      port: 7700
    persistence:
      size: 10Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

frontendLibrechatSecrets: {}
