name: CI

on:
  workflow_call:
    inputs:
      base_ref:
        description: Exact reviewed Base candidate for prepublication tooling quality only
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Reviewed candidate for source CI only; tag-driven publication requires stable Base.
  BASE_REF: d2053342856a82905d5ee3f00879e0547cb22909

jobs:
  validate:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.7"
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4
      - name: Install Kustomize
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          name: kustomize
          version: v5.8.1
      - name: Install kubeconform
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          name: kubeconform
          version: v0.8.0
      - name: Read exact Base prerequisite
        id: prerequisite
        run: |
          uv run --locked --project tooling python -c 'from pathlib import Path; from k8s_stack_tooling.addons import load_manifest; print("base=v" + load_manifest(Path("release/manifest.yaml")).spec.prerequisites.base)' >> "$GITHUB_OUTPUT"
      - name: Acquire selected Base release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neurwerk/k8s_stack_base
          ref: ${{ inputs.base_ref || (startsWith(github.ref, 'refs/tags/') && steps.prerequisite.outputs.base || env.BASE_REF) }}
          path: .ci/base
      - name: Run full validation
        run: make check BASE_REPO="$GITHUB_WORKSPACE/.ci/base"
      - name: Build the tooling image without publication
        run: |
          version="$(uv run --locked --project tooling python -c 'import tomllib; print(tomllib.load(open("tooling/pyproject.toml", "rb"))["project"]["version"])')"
          make tooling-build VERSION="$version" REVISION="$GITHUB_SHA"
      - name: Verify packaged permissions in the pinned native image
        run: |
          set -eu -o pipefail
          read -r tooling native < <(uv run --locked --project tooling python - <<'PY'
          import tomllib
          from pathlib import Path
          from k8s_stack_tooling.addons import load_manifest
          artifacts = {a.id: a.image for a in load_manifest(Path("release/manifest.yaml")).spec.artifacts}
          version = tomllib.loads(Path("tooling/pyproject.toml").read_text())["project"]["version"]
          print(artifacts["tooling"].split("@", 1)[0].rsplit(":", 1)[0] + ":" + version, artifacts["application"])
          PY
          )
          directory="$RUNNER_TEMP/librechat-payloads"
          mkdir -p "$directory"
          chmod 777 "$directory"
          docker run --rm --network none --read-only --user 65532:65532 \
            -v "$directory:/work/payloads" "$tooling" librechat-stage-permissions
          cmp "$directory/provision-permissions.cjs" tooling/src/librechat_tooling/payloads/provision-permissions.cjs
          test "$(stat -c '%a' "$directory/provision-permissions.cjs")" = 444
          docker run --rm --platform linux/amd64 --network none --read-only --user 1000:1000 --entrypoint node \
            -v "$directory:/work/payloads:ro" "$native" --check /work/payloads/provision-permissions.cjs
          # Native module imports initialize rotating logs even when the logger is silenced.
          docker run --rm --platform linux/amd64 --network none --read-only --user 1000:1000 --entrypoint node \
            --tmpfs /app/logs:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            "$native" -e 'const r=require("node:module").createRequire("/app/package.json"); const s=r("@librechat/data-schemas"); s.logger.silent=true; const a=r("@librechat/api"); const d=r("librechat-data-provider"); if(typeof r("mongoose").connect!=="function" || ![s.createModels,s.createMethods,s.scopedCacheKey,s.getTenantId,a.waitForKeyvRedisClient,a.standardCache].every(x=>typeof x==="function") || !d.CacheKeys.ROLES) process.exit(1);'
