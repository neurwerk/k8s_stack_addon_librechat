apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat-documentdb
  namespace: infra-postgres-operations
spec:
  interval: 5m
  timeout: 15m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  dependsOn:
    - name: postgres-operations
  chart:
    spec:
      chart: ./charts/postgres/documentdb-addon
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
  values:
    addon:
      toolingImage: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
      enabled: true
      user: librechat
      database: LibreChat
      passwordSecret: librechat-documentdb-password
