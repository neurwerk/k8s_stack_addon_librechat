apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-librechat-external-secrets
  namespace: frontend-librechat
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-librechat-secret-sync
    app.kubernetes.io/part-of: frontend-librechat
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frontend-librechat-openbao-secret-store
  namespace: frontend-librechat
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-librechat-secret-sync
    app.kubernetes.io/part-of: frontend-librechat
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: addon-librechat-runtime
          serviceAccountRef:
            name: frontend-librechat-external-secrets
            audiences:
              - openbao
