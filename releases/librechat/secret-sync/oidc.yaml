apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-oidc-secret
  namespace: auth-keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: auth-keycloak-openbao-secret-store
  target:
    name: librechat-oidc-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: clientSecret
      remoteRef:
        key: addons/librechat/oidc
        property: openidClientSecret
