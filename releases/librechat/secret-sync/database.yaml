apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-documentdb-password
  namespace: infra-postgres-operations
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infra-postgres-operations-openbao-secret-store
    kind: SecretStore
  target:
    name: librechat-documentdb-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: infra-postgres-operations/internal
        property: documentdbPassword
