apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-librechat-oidc
  namespace: auth-keycloak
spec:
  releaseName: auth-keycloak-librechat-oidc
  interval: 5m
  timeout: 15m
  dependsOn:
    - name: librechat-oidc-settings
    - name: keycloak-librechat-access
    - name: keycloak-agentgateway-oidc
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  chart:
    spec:
      chart: ./charts/keycloak/addon-oidc
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: auth-keycloak-app-defaults
    - kind: ConfigMap
      name: librechat-oidc-settings
    - kind: ConfigMap
      name: client-values
    - kind: ConfigMap
      name: keycloak-product-values
    - kind: ConfigMap
      name: librechat-oidc-approval-values
  values:
    k8sTools:
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.15.6@sha256:2cfe62109c8067e08a81f422733e6673ef3eb0ee11066f72e7316878a76013db
    clientSecret:
      name: librechat-oidc-secret
      key: clientSecret
