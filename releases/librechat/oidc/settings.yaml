apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat-oidc-settings
  namespace: auth-keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/librechat/oidc
      sourceRef:
        kind: GitRepository
        name: librechat-addon
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: client-values
    - kind: ConfigMap
      name: keycloak-product-values
