apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-librechat-access
  namespace: auth-keycloak
spec:
  interval: 5m
  timeout: 15m
  dependsOn:
    - name: keycloak-realm-roles
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  chart:
    spec:
      chart: ./charts/keycloak/addon-access
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: auth-keycloak-app-defaults
    - kind: ConfigMap
      name: client-values
    - kind: ConfigMap
      name: keycloak-product-values
    - kind: ConfigMap
      name: librechat-oidc-approval-values
  values:
    addonAccess:
      enabled: true
      name: librechat
      realmRoles: [librechat-user, librechat-admin]
      ownedRoles: [librechat-user, librechat-admin]
      realmRoleComposites:
        librechat-admin: [librechat-user]
      platformAdminRole: librechat-admin
      accessGroups:
        /access/neurwerk-librechat-admins:
          realmRoles: [librechat-admin]
        /access/neurwerk-librechat-users:
          realmRoles: [librechat-user]
